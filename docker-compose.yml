services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mercado
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # devo usar o valor que ja esta no env
    ports:
      - "5433:5432"
    healthcheck:
      start_period: 10s
      test: pg_isready -U $${POSTGRES_USER} -d mercado
      interval: 10s #dois segundos de intervalo
      retries: 3 #numero de tentativas maxiimas eu acho
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    profiles: ["dev"]
    depends_on:
      - healthcheck



  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER} #Ambos vem do env
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

volumes:
  postgres_data:
  rabbitmq_data:





